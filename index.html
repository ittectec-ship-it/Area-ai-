<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  body{margin:0;font-family:Segoe UI;background:#f3f4f6}
  #top{background:#2563eb;color:white;padding:10px;display:flex;gap:8px;justify-content:center}
  button{background:white;color:#2563eb;border:none;padding:8px 14px;border-radius:20px;font-weight:bold;cursor:pointer}
  iframe{width:100%;height:90vh;border:none;background:white}
</style>
</head>
<body>
<div id="top">
  <button onclick="insertPrompt()">✨ Ask to Insert in Word</button>
  <button onclick="autoPaste()">⚡ Auto-Paste</button>
</div>
<iframe src="https://arena.ai/agent"></iframe>

<script>
Office.onReady(()=>{});

async function insertPrompt(){
  let text = prompt("What did Arena generate? Paste it here and I'll ask if you want to insert:");
  if(!text) return;
  if(confirm("Do you want to paste this in your Word document?")){
    await Word.run(async (context)=>{
      context.document.getSelection().insertText(text, "Replace");
      await context.sync();
    });
  }
}

async function autoPaste(){
  let text = prompt("Paste Arena text for auto-insert:");
  if(!text) return;
  await Word.run(async (context)=>{
    context.document.getSelection().insertText(text, "Replace");
    await context.sync();
  });
}
</script>
</body>
</html>
